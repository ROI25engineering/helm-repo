{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "simple-service.fullname" . }}
  labels:
    {{- include "simple-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "simple-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: {{ .Values.networkPolicy.ingress | toJson }}
{{- end }}
